<svg xmlns="http://www.w3.org/2000/svg" width="1764" height="300" viewBox="0 0 1764 300" role="img" aria-labelledby="figTitle figDesc" font-family="'NVIDIA Sans','NVIDIA Sans Web',Inter,'Helvetica Neue',Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="figTitle">Tensor-sequence parallelism in a transformer layer</title>
<desc id="figDesc">A transformer layer shown left to right, alternating between sequence-parallel and tensor-parallel regions. LayerNorm, dropout and the residual additions run in sequence-parallel regions where activations are split along the sequence dimension. The attention and MLP weight matrices run in tensor-parallel regions where weights and their output activations are split along the hidden dimension. The collectives g and g-bar convert between the two regimes: g is an all-gather in the forward pass, g-bar a reduce-scatter.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#4B4B4B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="1764" height="300" fill="#FFFFFF"/>
