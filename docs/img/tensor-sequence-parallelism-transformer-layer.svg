<text x="424" y="161" font-size="11" fill="#757575" text-anchor="middle" dominant-baseline="central">W_qkv, column-wise</text>
<line x1="488" y1="150" x2="508" y2="150" stroke="#4B4B4B" stroke-width="1.4" marker-end="url(#ar)"/>
