<text x="218" y="150" font-size="12" fill="#313131" text-anchor="middle" dominant-baseline="central">LayerNorm</text>
<line x1="276" y1="150" x2="290" y2="150" stroke="#4B4B4B" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="292" y="118" width="40" height="64" rx="6" fill="#76B900"/>
<text x="312" y="152" font-size="16" font-style="italic" fill="#000000" text-anchor="middle" dominant-baseline="central">g</text>
<line x1="332" y1="150" x2="346" y2="150" stroke="#4B4B4B" stroke-width="1.4" marker-end="url(#ar)"/>
